name: Threads Auto Post

on:
  schedule:
    # 連鎖が切れた時の再開用（常駐中は single-keeper 判定で即終了するだけ）
    - cron: '2,32 * * * *'
  workflow_dispatch:

# 2026-10-02: 常駐ループ方式（Mac不要）。GitHubのcronは混雑時に1日3回まで間引かれ5.5時間停止した。
# 1回の実行が約5時間40分ループして10分ごとに投稿し、終了直前に自分自身を次に起動する（連鎖）。
# scheduleは「連鎖が切れていたら再開する」保険。重複起動は下の single-keeper で最古の実行だけ残す。
permissions:
  contents: write
  actions: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Single keeper check
        id: keeper
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # 引き継ぎ用: 旧runの終了を最大10分待つ（旧runは終了直前にChainするため）
          # 2026-10-07: 照会が失敗して空を返すと「旧run無し」と誤判定し、常駐runが2本並走して
          # 同じ投稿を3秒差で二重投稿した（masa 10/7 06:05）。照会失敗は「不明」として起動しない。
          older_of() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/auto_post.yml/runs?status=in_progress&per_page=30" \
              --jq ".workflow_runs[].id" > /tmp/inprog.txt 2>/tmp/inprog.err || return 2
            awk -v me="$GITHUB_RUN_ID" '$1 < me' /tmp/inprog.txt | head -1
          }
          OLDER=""; UNKNOWN=0
          for i in $(seq 1 20); do
            if R=$(older_of); then UNKNOWN=0; OLDER="$R"; else UNKNOWN=1; echo "照会失敗($i): $(head -c 200 /tmp/inprog.err)"; sleep 15; continue; fi
            [ -z "$OLDER" ] && break
            sleep 30
          done
          if [ "$UNKNOWN" = "1" ]; then
            echo "旧runの有無を確認できない → 二重起動を避けて終了（scheduleで再試行される）"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          elif [ -n "$OLDER" ]; then
            echo "既に常駐中の実行あり(run $OLDER) → この実行は終了"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.keeper.outputs.skip != '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.keeper.outputs.skip != '1'
        run: pip install PyNaCl --quiet

      - name: Create .env from secrets
        if: steps.keeper.outputs.skip != '1'
        run: |
          cat > .env << EOF
          THREADS_APP_ID=${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET=${{ secrets.THREADS_APP_SECRET }}
          THREADS_ACCESS_TOKEN_TRUTH=${{ secrets.THREADS_ACCESS_TOKEN_TRUTH }}
          THREADS_USER_ID_TRUTH=${{ secrets.THREADS_USER_ID_TRUTH }}
          THREADS_ACCESS_TOKEN_NAGAOKA=${{ secrets.THREADS_ACCESS_TOKEN_NAGAOKA }}
          THREADS_USER_ID_NAGAOKA=${{ secrets.THREADS_USER_ID_NAGAOKA }}
          THREADS_ACCESS_TOKEN_MASA=${{ secrets.THREADS_ACCESS_TOKEN_MASA }}
          THREADS_USER_ID_MASA=${{ secrets.THREADS_USER_ID_MASA }}
          GH_PAT=${{ secrets.GH_PAT }}
          GH_REPO=${{ github.repository }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY=${{ secrets.X_API_KEY }}
          X_API_SECRET=${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN=${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET=${{ secrets.X_ACCESS_TOKEN_SECRET }}
          DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
          EOF

      - name: Post loop (10分ごと・約5時間40分)
        if: steps.keeper.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 次サイクル開始は経過290分まで。最終サイクル最大(auto_post 50m+commit)でも約345分以内に収まり、355分timeoutの前にChainが走る
          END=$(( $(date +%s) + 290*60 ))
          prefill() {
            python3 -c "
          import json, subprocess, sys
          from pathlib import Path
          from datetime import date
          today = date.today().strftime('%Y-%m-%d')
          def has_today(f):
              if not Path(f).exists(): return False
              return any(json.loads(l).get('date')==today and json.loads(l).get('posts') for l in Path(f).read_text().splitlines() if l.strip())
          for a, f in (('truth','log_truth.jsonl'),('nagaoka','log_nagaoka.jsonl'),('masa','log_masa.jsonl')):
              if not has_today(f):
                  print(a+': キューなし → generate_remix で生成')
                  subprocess.run([sys.executable, 'generate_remix.py', a], check=False)
          "
          }
          # 2026-10-06: 手元pushと常駐ループの同一ファイル(uplink_repost_pool.json)更新が衝突し、
          # autostash復元が競合→未解決(U)のまま残り、以後70分 pull/commit が全失敗した。
          # pull直後に未解決ファイルがあれば手元(CI側の最新状態=stash)を採用して解消する。
          safe_pull() {
            git pull -q --rebase --autostash -X theirs origin main || { git rebase --abort 2>/dev/null || true; }
            U=$(git diff --name-only --diff-filter=U)
            if [ -n "$U" ]; then
              echo "::warning::autostash衝突を自動解消（CI側を採用）: $U"
              for f in $U; do git checkout --theirs -- "$f" 2>/dev/null || git checkout HEAD -- "$f"; done
              git reset -q
              git stash drop -q 2>/dev/null || true
            fi
          }
          commit_logs() {
            [ -n "$(git diff --name-only --diff-filter=U)" ] && safe_pull
            # 1件でも存在しないパスを渡すとgit addは全体を中止する（2026-10-02 dispatch_state.json未生成で
            # 台帳pushが40時間止まった）。存在するファイルだけを個別に追加する
            for f in log_truth.jsonl log_masa.jsonl log_nagaoka.jsonl \
                     log_truth_posted.jsonl log_masa_posted.jsonl log_nagaoka_posted.jsonl \
                     insights_truth.json insights_nagaoka.json insights_masa.json \
                     weights_truth.json weights_nagaoka.json weights_masa.json \
                     feedback.json line_listin_state.json shared_posted_guard.jsonl \
                     segment_registry.json dispatch_state.json log_x_truth_posted.jsonl \
                     uplink_repost_pool.json; do
              [ -e "$f" ] && git add "$f" 2>/dev/null
            done
            true
            git diff --cached --quiet || git commit -q -m "chore: update logs [skip ci]"
            for i in 1 2 3; do
              git push -q && break
              safe_pull
            done
          }
          while [ "$(date +%s)" -lt "$END" ]; do
            T0=$(date +%s)
            # 2026-10-07: 並走の第2防衛。自分より古い常駐runが動いていれば、こちらが降りる（Chainもしない）
            OLD2=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/auto_post.yml/runs?status=in_progress&per_page=30" --jq ".workflow_runs[].id" 2>/dev/null | awk -v me="$GITHUB_RUN_ID" '$1 < me' | head -1)
            if [ -n "$OLD2" ]; then echo "古い常駐run $OLD2 が稼働中 → 並走を避けてこのrunは降りる"; echo "yielded" > /tmp/yielded; break; fi
            echo "::group::cycle $(date '+%H:%M')"
            # 朝の生成・ヒーロー・プレイブック等の最新を取り込む（自分の未pushは直前のcommit_logsで反映済み）
            safe_pull
            prefill || true
            timeout 50m python3 auto_post.py all || true
            python3 token_manager.py --sync-secrets || true
            timeout 2m python3 dispatcher.py || true
            # X整体アカウント（2026-10-04）: 枠時刻に1本ずつ。キー未設定なら即終了
            timeout 2m python3 x_post.py || true
            commit_logs || true
            echo "::endgroup::"
            SLEEP=$(( 600 - ( $(date +%s) - T0 ) ))
            [ "$SLEEP" -gt 0 ] && sleep "$SLEEP"
          done
          git diff --quiet origin/main -- log_nagaoka_posted.jsonl log_truth_posted.jsonl log_masa_posted.jsonl || echo "::warning::posted-log push may have failed"

      - name: Chain next keeper
        if: always() && steps.keeper.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f /tmp/yielded ]; then echo "並走回避で降りたのでChainしない"; exit 0; fi
          for i in 1 2 3; do
            gh workflow run auto_post.yml --repo "$GITHUB_REPOSITORY" && echo "次の常駐実行を起動" && exit 0
            sleep 20
          done
          echo "::error::次の常駐実行の起動に失敗（scheduleの保険で再開される）"
