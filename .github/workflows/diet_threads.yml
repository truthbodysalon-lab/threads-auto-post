name: Diet Threads Post

# ダイエットThreads(@truth_nagaoka_daietto) API自動投稿。
# cronは持たない: 中央ディスパッチャ(dispatcher.py + schedule_table.json の diet-threads-*)が
# 9:00 / 11:00 / 13:00 / 15:00 / 20:00 (JST) に workflow_dispatch で起動する(inputs.slot が枠)。
# Grok Botのブラウザ投稿(7,8,10,12,14,16,17,19,21,22時)とは別の「追加」投稿。
on:
  workflow_dispatch:
    inputs:
      slot:
        description: '枠 (09:00 / 11:00 / 13:00 / 15:00 / 20:00)'
        required: true
        default: '09:00'
      dry_run:
        description: '1なら生成だけ(Threadsへ投稿しない)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: diet-threads
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run diet_threads
        env:
          THREADS_ACCESS_TOKEN_DIET: ${{ secrets.THREADS_ACCESS_TOKEN_DIET }}
          THREADS_USER_ID_DIET: ${{ secrets.THREADS_USER_ID_DIET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DIET_SLOT: ${{ github.event.inputs.slot }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python3 diet_threads.py

      # 投稿ログと(警告・制限による)停止ファイルを必ず保存する(失敗しても、投稿済みなら二重投稿を防ぐため)。log_diet_posted.jsonl は merge=union
      - name: Commit post log and pause file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -e log_diet_posted.jsonl ] && git add log_diet_posted.jsonl
          [ -e diet_threads_pause.json ] && git add diet_threads_pause.json
          git diff --cached --quiet && { echo "ログ変更なし"; exit 0; }
          git commit -q -m "chore: update diet threads log [skip ci]"
          for i in 1 2 3; do
            git push -q && exit 0
            git pull -q --rebase --autostash -X theirs origin main || { git rebase --abort 2>/dev/null || true; }
          done
          echo "::error::ダイエットThreadsの投稿ログのpushに失敗(二重投稿防止のため要確認)"
          exit 1
