name: Threads Daily Generate

on:
  schedule:
    # 毎日 6:47 JST (21:47 UTC 前日)
    - cron: '47 21 * * *'
  workflow_dispatch:

concurrency:
  group: threads-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          THREADS_APP_ID=${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET=${{ secrets.THREADS_APP_SECRET }}
          THREADS_ACCESS_TOKEN_TRUTH=${{ secrets.THREADS_ACCESS_TOKEN_TRUTH }}
          THREADS_USER_ID_TRUTH=${{ secrets.THREADS_USER_ID_TRUTH }}
          THREADS_ACCESS_TOKEN_NAGAOKA=${{ secrets.THREADS_ACCESS_TOKEN_NAGAOKA }}
          THREADS_USER_ID_NAGAOKA=${{ secrets.THREADS_USER_ID_NAGAOKA }}
          THREADS_ACCESS_TOKEN_MASA=${{ secrets.THREADS_ACCESS_TOKEN_MASA }}
          THREADS_USER_ID_MASA=${{ secrets.THREADS_USER_ID_MASA }}
          GH_PAT=${{ secrets.GH_PAT }}
          GH_REPO=${{ github.repository }}
          EOF

      # 自動投稿以外（本人・外部ツール）の伸びた投稿を抽出 → ヒーロー執筆(SKILL.md)と型の参考に使う。
      # 失敗しても前回ファイルを維持して続行（朝の生成を止めない）
      - name: Extract own winners (non-automated posts)
        continue-on-error: true
        run: python3 own_winners.py

      - name: Run insights
        run: python3 insights.py

      - name: Run analyze and tune weights
        run: python3 analyze_and_tune.py

      - name: Generate posts for @truth_body_salon
        run: python3 generate_remix.py truth

      - name: Generate posts for @truth_nagaoka
        run: python3 generate_remix.py nagaoka

      - name: Generate posts for @masahide_takahashi_
        run: python3 generate_remix.py masa

      - name: Commit generated posts and updated weights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add log_truth.jsonl log_nagaoka.jsonl log_masa.jsonl \
                  insights_truth.json insights_nagaoka.json insights_masa.json \
                  past_posts.json past_posts_nagaoka.json past_posts_masa.json \
                  weights_truth.json weights_nagaoka.json weights_masa.json \
                  segment_registry.json \
                  own_winners_truth.json own_winners_nagaoka.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: daily generate & tune [skip ci]"
          for i in 1 2 3; do
            git push && break
            echo "Push failed (attempt $i), retrying..."
            git pull --rebase -X theirs origin main || { git rebase --abort 2>/dev/null || true; }
          done
