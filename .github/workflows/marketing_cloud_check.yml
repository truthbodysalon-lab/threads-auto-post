name: Marketing cloud dispatch check (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify cross-repository access and dispatch a non-publishing analysis test
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          root='https://api.github.com/repos/minetownmasa-dotcom/instagram-marketing'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          with urllib.request.urlopen(urllib.request.Request(root,headers=headers),timeout=20) as response:
              repo=json.load(response)
          assert repo['full_name']=='minetownmasa-dotcom/instagram-marketing' and repo['private']
          data=json.dumps({'ref':'main','inputs':{'dry_run':True}}).encode()
          request=urllib.request.Request(root+'/actions/workflows/ig-analyze.yml/dispatches',data=data,headers=dict(headers,**{'Content-Type':'application/json'}),method='POST')
          with urllib.request.urlopen(request,timeout=20) as response:
              assert response.status==204
          print('PASS: cloud dispatcher can access the new private repository and start the analysis dry run')
          PY
