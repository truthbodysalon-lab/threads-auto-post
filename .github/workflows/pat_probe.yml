name: pat_probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: list workflows
        run: |
          for r in ig-autopost-cloud line-stepmail-cloud cloud-daily-tasks note-auto blog-auto-post; do
            code=$(curl -s -m 30 -o /tmp/o.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/truthbodysalon-lab/$r/actions/workflows)
            echo "LIST $r http=$code total=$(python3 -c "import json;print(json.load(open('/tmp/o.json')).get('total_count'))" 2>/dev/null)"
          done
      - name: dispatch deadman (read-only)
        run: |
          code=$(curl -s -m 30 -o /tmp/d.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/truthbodysalon-lab/line-stepmail-cloud/actions/workflows/deadman.yml/dispatches -d '{"ref":"main"}')
          echo "DISPATCH line-stepmail-cloud deadman.yml http=$code"; cat /tmp/d.json
