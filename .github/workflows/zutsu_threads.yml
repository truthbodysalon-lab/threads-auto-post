name: Zutsu Threads Post

# 頭痛Threads(@truth_nagaoka_zutsuu) API自動投稿。2026-11-05 diet_threads.yml を元に作成。
# cronは持たない: 中央ディスパッチャ(dispatcher.py + schedule_table.json の zutsu-threads-*)が
# 1日10枠 6:30/8:30/9:15/10:30/12:30/14:30/17:30/18:15/20:15/22:30 (JST) に workflow_dispatch で起動する(inputs.slot が枠)。
# （2026-11-11に一時20枠→2026-11-14 masa指示「各アカウント合計1日10本にして」で10枠→同日Grok側daietto/masa Bufferの時刻を避けて再配置。正本は zutsu_threads.py の SLOTS と schedule_table.json）
# 9:15/14:30/20:15 は図解カード(Pillowで描く・AI生成ではない)＋解説文の画像投稿（2026-11-11 masa指示・2026-11-14 枠を再配置）。
# トークン(THREADS_ACCESS_TOKEN_ZUTSU)が未登録の間は何もせず正常終了する。
on:
  workflow_dispatch:
    inputs:
      slot:
        description: '枠 (zutsu_threads.SLOTS の20枠: 06:00〜23:15)'
        required: true
        default: '08:30'
      dry_run:
        description: '1なら生成だけ(Threadsへ投稿しない)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: zutsu-threads
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fonts and Pillow (図解カード用)
        run: |
          # 図解の枠（zutsu_threads.IMAGE_SLOTS）。2026-11-26: 11/14の再配置で枠が9:15/14:30/20:15になったのに、ここだけ旧時刻のままだったのを直した
          if [ "${{ github.event.inputs.slot }}" = "09:15" ] || [ "${{ github.event.inputs.slot }}" = "14:30" ] || [ "${{ github.event.inputs.slot }}" = "20:15" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk || echo "::warning::フォント導入失敗（文字だけで投稿する）"
          fi
          pip install -q pillow || echo "::warning::Pillow導入失敗（文字だけで投稿する）"

      - name: Run zutsu_threads
        env:
          THREADS_ACCESS_TOKEN_ZUTSU: ${{ secrets.THREADS_ACCESS_TOKEN_ZUTSU }}
          THREADS_USER_ID_ZUTSU: ${{ secrets.THREADS_USER_ID_ZUTSU }}
          # 2026-11-26 masa指示「課金はなし」: Anthropic API（従量課金）をやめ、Gemini の無料枠で生成する
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ZUTSU_SLOT: ${{ github.event.inputs.slot }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python3 zutsu_threads.py

      # 締めの試し分けの集計（1日1回・最後の枠のあと。2026-11-26 masa指示「→他のCTAで試して」）。失敗しても投稿には影響しない
      - name: CTA report
        if: github.event.inputs.slot == '23:15'
        continue-on-error: true
        env:
          THREADS_ACCESS_TOKEN_ZUTSU: ${{ secrets.THREADS_ACCESS_TOKEN_ZUTSU }}
        run: python3 zutsu_cta_report.py || true

      # 投稿ログと(警告・制限による)停止ファイルを必ず保存する(失敗しても、投稿済みなら二重投稿を防ぐため)。log_zutsu_posted.jsonl は merge=union
      - name: Commit post log and pause file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -e log_zutsu_posted.jsonl ] && git add log_zutsu_posted.jsonl
          [ -e zutsu_threads_pause.json ] && git add zutsu_threads_pause.json
          [ -e zutsu_cta_report.json ] && git add zutsu_cta_report.json
          git diff --cached --quiet && { echo "ログ変更なし"; exit 0; }
          git commit -q -m "chore: update zutsu threads log [skip ci]"
          for i in 1 2 3; do
            git push -q && exit 0
            git pull -q --rebase --autostash -X theirs origin main || { git rebase --abort 2>/dev/null || true; }
          done
          echo "::error::頭痛Threadsの投稿ログのpushに失敗(二重投稿防止のため要確認)"
          exit 1
