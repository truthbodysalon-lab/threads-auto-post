# 一時的な確認用（GitHub Models が無料で使えるか）。確認後に削除する
name: zz models probe
on:
  workflow_dispatch:
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe
        env:
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          tok = os.environ["GH_MODELS_TOKEN"]
          try:
              cat = json.load(urllib.request.urlopen(urllib.request.Request("https://models.github.ai/catalog/models", headers={"Authorization": f"Bearer {tok}"}), timeout=30))
              print("catalog:", len(cat))
              for m in cat:
                  print(" ", m.get("id"), m.get("rate_limit_tier"))
          except Exception as e:
              print("catalog err", e)
          for model in ["openai/gpt-4.1", "openai/gpt-4.1-mini", "openai/gpt-5-mini", "openai/gpt-4o-mini", "deepseek/deepseek-v3-0324", "xai/grok-3-mini"]:
              body = json.dumps({"model": model, "messages": [{"role": "system", "content": "日本語のライター"}, {"role": "user", "content": "「頭痛」を使った短い一文を1つ"}], "max_tokens": 100}).encode()
              req = urllib.request.Request("https://models.github.ai/inference/chat/completions", data=body, headers={"Authorization": f"Bearer {tok}", "Content-Type": "application/json"})
              try:
                  r = urllib.request.urlopen(req, timeout=60)
                  d = json.load(r)
                  print("OK", model, d["choices"][0]["message"]["content"][:60].replace("\n", " "))
                  print("   limits:", {k: v for k, v in r.headers.items() if "ratelimit" in k.lower()})
              except urllib.error.HTTPError as e:
                  print("ERR", model, e.code, e.read().decode()[:200].replace("\n", " "))
          PY
